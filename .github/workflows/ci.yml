name: Java Regression Check

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile all Java files
        run: javac -d out src/expensetracker/*.java

      - name: Run Regression Tests
        run: java -cp out expensetracker.RegressionTest
